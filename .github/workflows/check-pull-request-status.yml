name: Check Pull Request Status
on: [pull_request]

jobs:
  check-build-status:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run Install
        run: yarn

      - name: Tests
        run: yarn test
